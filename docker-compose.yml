version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: codevita_postgres
    restart: always
    environment:
      POSTGRES_USER: codevita_user
      POSTGRES_PASSWORD: codevita_secure_password_2026
      POSTGRES_DB: codevita_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codevita_user -d codevita_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codevita_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://codevita_user:codevita_secure_password_2026@postgres:5432/codevita_db
      SECRET_KEY: super-secret-jwt-key-change-in-production-codevita
      AI_PROVIDER: ${AI_PROVIDER:-nvidia}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/llama-3.1-nemotron-70b-instruct}
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codevita_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
